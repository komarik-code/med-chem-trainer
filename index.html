<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f5f6fb" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0e1016" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="Тренажер тестів з медичної хімії: навчання, іспит, повторення помилок" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <title>ХімТренажер</title>
    <script>
      // застосувати тему до першого рендеру, щоб не було «спалаху»
      try {
        var t = JSON.parse(localStorage.getItem('med-chem-trainer:settings') || '{}').theme
        var dark = t === 'dark' || ((!t || t === 'system') && matchMedia('(prefers-color-scheme: dark)').matches)
        if (dark) document.documentElement.classList.add('dark')
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
